[package]
name = "tumr-cli"
description = "The `tumr` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tumr"
path = "src/main.rs"

[dependencies]
tumr-core = { path = "../../crates/tumr-core" }
tumr-api = { path = "../../crates/tumr-api" }
tumr-mcp = { path = "../../crates/tumr-mcp" }
tumr-platform = { path = "../../crates/tumr-platform" }
tumr-env = { path = "../../crates/tumr-env" }
tumr-resolver = { path = "../../crates/tumr-resolver" }
tumr-installer = { path = "../../crates/tumr-installer" }
tumr-storage = { path = "../../crates/tumr-storage" }
tumr-elevate = { path = "../../helpers/elevated-helper" }
# Command-line parsing (subcommands, --help, --version).
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "time", "signal", "macros", "io-std", "io-util", "sync"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
