[workspace]
resolver = "2"
members = ["crates/umr-core", "apps/cli"]
# Phase 0 experiments are a separate workspace and are not part of the product.
exclude = ["poc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/Jishnu2608/AI-Mobile-Runtime"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
