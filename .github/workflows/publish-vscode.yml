name: Publish VS Code extension

# Manual only. Builds the extension (Windows x64 target), runs its tests and publishes the same
# .vsix to the Visual Studio Marketplace and/or Open VSX.
#   Visual Studio Marketplace: Trusted Publishing (OpenID Connect), no stored token. Azure DevOps
#     personal access tokens are retired on 1 December 2026. The owner creates the policy once on
#     the publisher (marketplace.visualstudio.com/manage > publisher > Trusted Publishing > Create):
#     owner Jishnu2608, repository TUMR, workflow file publish-vscode.yml, no
#     environment. GitHub hands this job a short-lived identity token (id-token: write below);
#     vsce (4.1.0 or later) exchanges it for a Marketplace credential that lasts 15 minutes.
#   Open VSX: Trusted Publishing too (ovsx publish --trusted-publishing). The owner registers it
#     once on open-vsx.org (Settings > Trusted Publishers) for the `tumr` namespace: owner
#     Jishnu2608, repository TUMR, workflow publish-vscode.yml, no environment. No OVSX_PAT
#     secret: if one is set it would take precedence, so leave it out.
# With "dry run" on, nothing is published: the .vsix is only built and kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [both, marketplace, openvsx]
        default: both
      dry_run:
        description: "Only build and check, do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  # Trusted Publishing: lets the job ask GitHub for an OpenID Connect token for the Marketplace
  id-token: write

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  publish:
    name: Build, check and publish the extension
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui/package-lock.json
            apps/vscode/package-lock.json

      # One command per step: on Windows the steps run in PowerShell, where a failing npm line in
      # a multi-line block does not stop the block (only the last exit code counts).

      # the Mobile Preview panel is the desktop app's preview page
      - name: Install the preview page's packages
        run: npm --prefix apps/desktop/ui ci --no-audit --no-fund

      - name: Build the preview page
        run: npm --prefix apps/desktop/ui run build

      - name: Install the extension's packages
        run: npm --prefix apps/vscode ci --no-audit --no-fund

      - name: Package the extension
        run: npm --prefix apps/vscode run package

      - name: Test the extension
        run: npm --prefix apps/vscode test

      # the Marketplace refuses a version it already has: stop here with a clear message instead
      - name: Check the version and its release notes
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        working-directory: apps/vscode
        run: |
          $m = Get-Content package.json -Raw | ConvertFrom-Json
          $notes = Get-Content CHANGELOG.md -Raw
          if ($notes -notmatch "(?m)^## $([regex]::Escape($m.version))\s*$") {
            throw "CHANGELOG.md has no '## $($m.version)' entry: bump the version and describe the change first"
          }
          # not listed yet (first publish) or offline: nothing to compare with
          $listed = npx --no-install vsce show "$($m.publisher).$($m.name)" --json 2>$null
          if ($LASTEXITCODE -eq 0 -and $listed) {
            $versions = @(($listed | Out-String | ConvertFrom-Json).versions.version)
            if ($versions -contains $m.version) {
              throw "Version $($m.version) is already on the Visual Studio Marketplace: bump it in package.json"
            }
          }
          $global:LASTEXITCODE = 0

      - name: Show what will be published
        shell: pwsh
        run: |
          $m = Get-Content apps/vscode/package.json -Raw | ConvertFrom-Json
          "Extension: $($m.publisher).$($m.name) $($m.version) (preview: $($m.preview), target win32-x64)"
          (Get-FileHash apps/vscode/dist/tumr-vscode.vsix -Algorithm SHA256).Hash.ToLower()

      - uses: actions/upload-artifact@v4
        with:
          name: tumr-vscode-vsix
          path: apps/vscode/dist/tumr-vscode.vsix
          if-no-files-found: error

      - name: Publish to the Visual Studio Marketplace
        if: ${{ !inputs.dry_run && (inputs.target == 'both' || inputs.target == 'marketplace') }}
        working-directory: apps/vscode
        # Trusted Publishing: no secret. Fails with an authorisation error until the owner has
        # created the policy for this repository and workflow on the publisher.
        run: npx --no-install vsce publish --oidc --packagePath dist/tumr-vscode.vsix

      - name: Publish to Open VSX
        if: ${{ !inputs.dry_run && (inputs.target == 'both' || inputs.target == 'openvsx') }}
        working-directory: apps/vscode
        # Trusted Publishing as well (ovsx 1.3.0 or later, pinned): no secret. Fails until the
        # owner has registered this repository and workflow as a trusted publisher of the `tumr`
        # namespace on open-vsx.org (Settings > Trusted Publishers).
        run: npx --no-install ovsx publish --trusted-publishing --packagePath dist/tumr-vscode.vsix
