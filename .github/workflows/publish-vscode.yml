name: Publish VS Code extension

# Manual only. Builds the extension (Windows x64 target), runs its tests and publishes the same
# .vsix to the Visual Studio Marketplace and/or Open VSX. The tokens are repository secrets the
# owner adds once (Settings > Secrets and variables > Actions):
#   VSCE_PAT  Azure DevOps personal access token, scope "Marketplace > Manage", all organisations
#   OVSX_PAT  Open VSX access token
# With "dry run" on, nothing is published: the .vsix is only built and kept as an artifact.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [both, marketplace, openvsx]
        default: both
      dry_run:
        description: "Only build and check, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  publish:
    name: Build, check and publish the extension
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/ui/package-lock.json
            apps/vscode/package-lock.json

      # the Mobile Preview panel is the desktop app's preview page
      - name: Build the preview page
        run: |
          npm --prefix apps/desktop/ui ci --no-audit --no-fund
          npm --prefix apps/desktop/ui run build

      - name: Package and test the extension
        run: |
          npm --prefix apps/vscode ci --no-audit --no-fund
          npm --prefix apps/vscode run package
          npm --prefix apps/vscode test

      - name: Show what will be published
        shell: pwsh
        run: |
          $m = Get-Content apps/vscode/package.json -Raw | ConvertFrom-Json
          "Extension: $($m.publisher).$($m.name) $($m.version) (preview: $($m.preview), target win32-x64)"
          (Get-FileHash apps/vscode/dist/umr-vscode.vsix -Algorithm SHA256).Hash.ToLower()

      - uses: actions/upload-artifact@v4
        with:
          name: umr-vscode-vsix
          path: apps/vscode/dist/umr-vscode.vsix
          if-no-files-found: error

      - name: Publish to the Visual Studio Marketplace
        if: ${{ !inputs.dry_run && (inputs.target == 'both' || inputs.target == 'marketplace') }}
        working-directory: apps/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if (-not $env:VSCE_PAT) { throw "The VSCE_PAT secret is not set" }
          npx vsce publish --packagePath dist/umr-vscode.vsix

      - name: Publish to Open VSX
        if: ${{ !inputs.dry_run && (inputs.target == 'both' || inputs.target == 'openvsx') }}
        working-directory: apps/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if (-not $env:OVSX_PAT) { throw "The OVSX_PAT secret is not set" }
          npx ovsx publish dist/umr-vscode.vsix
