name: CI

# Runs on every push and pull request (public repo: GitHub-hosted runners are free).
# scripts/ci-local.ps1 runs the same checks locally; keep running it before every commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain + components.
      - name: Show toolchain
        run: rustup show active-toolchain && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      # The desktop app embeds the built web UI, so it must exist before Rust compiles it.
      - name: UI build
        run: |
          npm --prefix apps/desktop/ui ci --no-audit --no-fund
          npm --prefix apps/desktop/ui run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Smoke test
        shell: pwsh
        run: |
          ./target/release/umr.exe --version
          ./target/release/umr-core.exe --version
