# GitHub secret scanning: paths whose "secrets" are test data, not credentials.
# The log sanitiser's tests feed it fake tokens (GitHub, AWS, Google, Slack, Anthropic, JWT,
# private-key blocks) to prove they are masked. The tests now build those strings from pieces at
# run time, so current files hold no token-shaped text; this entry also covers older commits.
paths-ignore:
  - "crates/umr-diagnostics/src/sanitize.rs"
