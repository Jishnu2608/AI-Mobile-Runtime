name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: Fits the current scope (Windows host, Android, local only, works with any agent), or I explain why it should change
