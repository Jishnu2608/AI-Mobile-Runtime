[package]
name = "umr-core"
description = "Runtime Core: background service that owns environment, devices, sessions and diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "umr-core"
path = "src/main.rs"

[dependencies]
umr-platform = { path = "../umr-platform" }
umr-api = { path = "../umr-api" }
umr-storage = { path = "../umr-storage" }
umr-env = { path = "../umr-env" }
umr-resolver = { path = "../umr-resolver" }
umr-installer = { path = "../umr-installer" }
umr-device = { path = "../umr-device" }
umr-supervisor = { path = "../umr-supervisor" }
umr-session = { path = "../umr-session" }
umr-adapter = { path = "../../adapters/sdk" }
umr-adapter-gradle = { path = "../../adapters/gradle-android" }
umr-adapter-flutter = { path = "../../adapters/flutter" }
umr-adapter-react-native = { path = "../../adapters/react-native" }
notify = "8"
umr-elevate = { path = "../../helpers/elevated-helper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API tokens: hashing (only SHA-256 hashes are stored) and OS randomness for generation.
sha2 = "0.10"
getrandom = "0.3"
# Async runtime: Ctrl+C handling now; named-pipe API and process supervision later (CORE-003, DEV-004).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
# Structured logging to rotating files (+ stderr in foreground mode).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
umr-platform = { path = "../umr-platform" }
umr-env = { path = "../umr-env" }
umr-storage = { path = "../umr-storage" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
