[package]
name = "umr-storage"
description = "Local storage of the Runtime Core: SQLite database with migrations, and the TOML config file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Embedded SQLite (compiled in via "bundled"; no system SQLite needed).
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints]
workspace = true
