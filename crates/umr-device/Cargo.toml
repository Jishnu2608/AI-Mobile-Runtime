[package]
name = "umr-device"
description = "Device layer (Phase 2): adb host-protocol client, the product's private adb server, device tracking, coexistence with other adb servers, AVD catalogue, emulator boot and health."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.12"
prost = "0.13"
http = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
tokio-stream = "0.1"
umr-platform = { path = "../umr-platform" }
umr-supervisor = { path = "../umr-supervisor" }

[lints]
workspace = true
