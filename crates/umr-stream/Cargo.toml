[package]
name = "umr-stream"
description = "Live preview (Phase 4): emulator gRPC frames and input over a localhost WebSocket for the preview window; pipeline timing and the latency self-test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = "0.24"
umr-device = { path = "../umr-device" }

[lints]
workspace = true
