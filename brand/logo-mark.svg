       Graphite & Lime: graphite tile, off-white phone, electric-lime prompt #B9E769. -->
  <defs>
    <linearGradient id="umr-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c312e"/>
      <stop offset="1" stop-color="#1a1d1b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#umr-tile)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <rect x="17.5" y="8.5" width="29" height="47" rx="7.5" fill="#202321" stroke="#f0f1ed" stroke-width="4"/>
  <path d="M25 25.5 32 32l-7 6.5" fill="none" stroke="#b9e769" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
